
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Cá Nhân Của Tùng -Đăng nhập / Đăng ký</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
      background: #eef2f5;
      color: #222;
    }

    /* Thanh điều hướng */
    .navbar {
      height: 65px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      box-shadow: 0 2px 12px #00000008;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #222;
      text-decoration: none;
    }

    .logo span {
      color: #05c99a;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      font-size: 12px;
      color: #555;
      text-decoration: none;
    }

    .nav-links a:hover {
      color: #05bd91;
    }

    /* Phần nền */
    .hero {
      min-height: calc(100vh - 65px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 16px;
      background:
        linear-gradient(#10253630, #10253630),
        url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1800&q=85")
        center/cover no-repeat;
    }

    /* Khung đăng nhập */
    .auth-card {
      width: 100%;
      max-width: 390px;
      background: #fff;
      padding: 30px 30px 24px;
      border-radius: 5px;
      box-shadow: 0 15px 45px #00000030;
      animation: appear 0.45s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-card h1 {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #888;
      font-size: 11px;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 13px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #444;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      height: 39px;
      padding: 0 38px 0 12px;
      border: 1px solid #e0e4e8;
      border-radius: 3px;
      outline: none;
      font-family: inherit;
      font-size: 11px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrap input:focus {
      border-color: #05c99a;
      box-shadow: 0 0 0 3px #05c99a18;
    }

    .input-wrap .field-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 12px;
    }

    .forgot {
      display: block;
      text-align: right;
      font-size: 10px;
      color: #00ad82;
      text-decoration: none;
      margin-top: 8px;
    }

    .primary-btn {
      width: 100%;
      height: 39px;
      margin-top: 17px;
      border: none;
      border-radius: 3px;
      background: #06c99a;
      color: white;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .primary-btn:hover {
      background: #00ae84;
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #999;
      font-size: 10px;
      margin: 23px 0 15px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #e9e9e9;
      flex: 1;
    }

    /* Nút mạng xã hội */
    .social-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .social-btn {
      height: 61px;
      border: 1px solid #e7e7e7;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-family: inherit;
      transition: 0.2s;
    }

    .social-btn:hover {
      background: #f8fafb;
      border-color: #ccc;
    }

    .social-btn i {
      font-size: 18px;
    }

    .social-btn span {
      font-size: 9px;
      color: #666;
    }

    .google { color: #4285f4; }
    .facebook { color: #1877f2; }
    .apple { color: #111; }

    .switch-text {
      text-align: center;
      font-size: 10px;
      color: #777;
      margin-top: 22px;
    }

    .switch-text button {
      border: none;
      background: none;
      color: #00ad82;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      font-size: 10px;
    }

    .message {
      display: none;
      margin-top: 13px;
      padding: 10px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.6;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #a61c1c;
      background: #fff0f0;
    }

    .message.success {
      color: #087c5b;
      background: #eafff7;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #fff;
      padding: 9px 7%;
      display: flex;
      justify-content: space-between;
      color: #888;
      font-size: 9px;
    }

    footer a {
      color: #888;
      text-decoration: none;
      margin-left: 12px;
    }

    @media (max-width: 500px) {
      .navbar {
        height: 58px;
        padding: 0 18px;
      }

      .nav-links {
        gap: 12px;
      }

      .nav-links a {
        font-size: 10px;
      }

      .hero {
        min-height: calc(100vh - 58px);
        padding: 25px 14px 45px;
      }

      .auth-card {
        max-width: 360px;
        padding: 26px 22px 22px;
      }

      footer {
        position: static;
        padding: 12px 16px;
      }
    }

    @media (max-height: 650px) {
      .hero {
        align-items: flex-start;
      }

      footer {
        position: static;
      }
    }
  </style>
</head>

<body>
  <header class="navbar">
    <a href="./index.html" class="logo">loc<span>Host</span></a>

    <nav class="nav-links">
      <a href="./index.html">Trang chủ</a>
      <a href="./index.html#about">Giới thiệu</a>
      <a href="./index.html#contact">Liên hệ</a>
    </nav>
  </header>

  <main class="hero">
    <section class="auth-card">
      <h1 id="formTitle">Tạo Tài Khoản</h1>
      <p class="subtitle" id="formSubtitle">
        Tạo một tài khoản để bắt đầu.
      </p>

      <form id="authForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >
            <i class="fa-regular fa-user field-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="Mật Khẩu">Mật Khẩu</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              minlength="6"
              required
            >
            <i class="fa-solid fa-lock field-icon"></i>
          </div>
        </div>

        <div class="form-group" id="confirmGroup">
          <label for="confirmPassword">Xác nhận Mật Khẩu</label>
          <div class="input-wrap">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Re-enter your password"
              autocomplete="new-password"
            >
            <i class="fa-solid fa-lock field-icon"></i>
          </div>
        </div>

        <a href="#" class="forgot" id="forgotLink" hidden>
          Quên mật khẩu?
        </a>

        <button class="primary-btn" id="submitBtn" type="submit">
          Tạo Tài Khoản
        </button>

        <div class="message" id="message" role="status"></div>
      </form>

      <div class="divider">Đăng nhập cùng với </div>

      <div class="social-buttons">
        <button class="social-btn" type="button" data-provider="Google">
          <i class="fa-brands fa-google google"></i>
          <span>Google</span>
        </button>

        <button class="social-btn" type="button" data-provider="Facebook">
          <i class="fa-brands fa-facebook facebook"></i>
          <span>Facebook</span>
        </button>

        <button class="social-btn" type="button" data-provider="Apple">
          <i class="fa-brands fa-apple apple"></i>
          <span>Apple</span>
        </button>
      </div>

      <p class="switch-text">
        <span id="switchLabel">Đã có tài khoản chưa?</span>
        <button type="button" id="switchBtn">Đăng nhập</button>
      </p>
    </section>
  </main>

  <footer>
    <span>© 2026 TùngTKT. Mọi quyền được bảo lưu.</span>
    <span>
      <a href="#">Privacy Policy</a>
      <a href="#">Terms</a>
    </span>
  </footer>

  <script>
    const authForm = document.getElementById("authForm");
    const formTitle = document.getElementById("formTitle");
    const formSubtitle = document.getElementById("formSubtitle");
    const confirmGroup = document.getElementById("confirmGroup");
    const confirmPassword = document.getElementById("confirmPassword");
    const submitBtn = document.getElementById("submitBtn");
    const switchLabel = document.getElementById("switchLabel");
    const switchBtn = document.getElementById("switchBtn");
    const forgotLink = document.getElementById("forgotLink");
    const message = document.getElementById("message");
    const divider = document.querySelector(".divider");

    let isSignUp = true;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message show " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function updateForm() {
      clearMessage();

      if (isSignUp) {
        formTitle.textContent = "Create Account";
        formSubtitle.textContent = "Create an account to get started.";
        submitBtn.textContent = "Sign Up";
        confirmGroup.style.display = "block";
        confirmPassword.required = true;
        switchLabel.textContent = "Already have an account?";
        switchBtn.textContent = "Sign in";
        forgotLink.hidden = true;
        divider.textContent = "Or sign up with";
      } else {
        formTitle.textContent = "Sign In";
        formSubtitle.textContent = "Welcome back! Please sign in.";
        submitBtn.textContent = "Sign In";
        confirmGroup.style.display = "none";
        confirmPassword.required = false;
        switchLabel.textContent = "Don't have an account?";
        switchBtn.textContent = "Create account";
        forgotLink.hidden = false;
        divider.textContent = "Or sign in with";
      }
    }

    switchBtn.addEventListener("click", () => {
      isSignUp = !isSignUp;
      authForm.reset();
      updateForm();
    });

    authForm.addEventListener("submit", (event) => {
      event.preventDefault();
      clearMessage();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = confirmPassword.value;

      if (password.length < 6) {
        showMessage("Mật khẩu cần có ít nhất 6 ký tự.", "error");
        return;
      }

      if (isSignUp && password !== confirm) {
        showMessage("Mật khẩu xác nhận không khớp.", "error");
        return;
      }

      if (isSignUp) {
        showMessage(
          "Kiểm tra hợp lệ thành công! Muốn tạo tài khoản thật, bạn cần kết nối hệ thống xác thực ở phía máy chủ.",
          "success"
        );
      } else {
        showMessage(
          "Giao diện đã nhận thông tin. Chức năng đăng nhập thật cần được kết nối với hệ thống xác thực.",
          "success"
        );
      }

      console.log("Demo form:", {
        mode: isSignUp ? "sign-up" : "sign-in",
        email: email
      });
    });

    forgotLink.addEventListener("click", (event) => {
      event.preventDefault();
      showMessage(
        "Chức năng đặt lại mật khẩu cần được thiết lập với hệ thống xác thực.",
        "error"
      );
    });

    document.querySelectorAll("[data-provider]").forEach((button) => {
      button.addEventListener("click", () => {
        showMessage(
          "Đăng nhập " + button.dataset.provider +
          " cần được cấu hình OAuth trước khi sử dụng thật.",
          "error"
        );
      });
    });

    updateForm();
  </script>
</body>
</html>
